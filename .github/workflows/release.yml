name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4

  # When release-please cuts a release, build the app bundle and attach it.
  upload-app:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # bundle.sh derives the version via `git describe`

      - name: Build app bundle
        run: SWIFT=swift ./Scripts/bundle.sh

      - name: Zip app
        run: ditto -c -k --keepParent build/island.app island.app.zip

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ needs.release-please.outputs.tag_name }}' island.app.zip

  # Point the Homebrew tap (zzcan/homebrew-island) at the release that was
  # just published. Auth via a write deploy key stored as TAP_DEPLOY_KEY.
  update-cask:
    needs: [release-please, upload-app]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zzcan/homebrew-island
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}

      - name: Bump cask version and sha256
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          VERSION="${TAG#v}"
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/${TAG}/island.app.zip" -o /tmp/island.app.zip
          SHA256="$(sha256sum /tmp/island.app.zip | cut -d' ' -f1)"
          sed -i -E "s|^  version \".*\"|  version \"${VERSION}\"|" Casks/island.rb
          sed -i -E "s|^  sha256 \".*\"|  sha256 \"${SHA256}\"|" Casks/island.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/island.rb
          git commit -m "island ${VERSION}"
          git push
